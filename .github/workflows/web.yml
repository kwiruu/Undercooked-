name: Build and deploy web version

on:
  push:
    branches: [master, web-port]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the publish step push the built site to the web-build branch

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build desktop jar and web version
        # For readable errors in the browser console while debugging, set setObfuscated(false)
        # and TeaVMOptimizationLevel.SIMPLE in teavm/.../TeaVMBuilder.java.
        run: |
          chmod +x gradlew
          ./gradlew :lwjgl3:jar :teavm:build --stacktrace

      - name: Report web build size
        run: |
          du -sh teavm/build/dist/webapp
          du -sh teavm/build/dist/webapp/* | sort -rh

      - uses: actions/upload-artifact@v4
        with:
          name: undercooked-web
          path: teavm/build/dist/webapp

      # Render serves the web-build branch as a static site and redeploys whenever it changes.
      # (Render's static site builder has no Java, so the game is built here instead.)
      - name: Publish the built site to the web-build branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: teavm/build/dist/webapp
          publish_branch: web-build
          force_orphan: true
